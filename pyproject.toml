[project]
name = "boardgamehub"
version = "0.1.0"
description = "BoardGameHub - board game collection manager"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.127.0",
    "httpx>=0.28.1",
    "pandas>=2.3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "redis>=7.1.0",
    "sqlmodel>=0.0.29",
    "typer>=0.21.0",
    "uvicorn>=0.40.0",
    "numpy<2.4",
]

[tool.setuptools]
packages = ["app", "frontend"]

[dependency-groups]
dev = [
    "anyio>=4.12.0",
    "pytest>=9.0.2",
    "streamlit>=1.52.2",
]